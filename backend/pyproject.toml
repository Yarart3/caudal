[project]
name = "caudal"
version = "0.1.0"
description = "Caudal: finanzas personales y familiares, en local"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.4",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "argon2-cffi==25.1.0",
    "openpyxl==3.1.5",  # lectura de los extractos .xlsx (Fase 1b)
    "python-multipart==0.0.32",  # subida de archivos (formularios multipart) en FastAPI
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",  # cliente HTTP del TestClient de FastAPI
    "ruff==0.17.0",
]

[tool.uv]
# La app no se instala como paquete: se ejecuta desde /app
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "S", "DTZ"]
ignore = [
    "B008",  # Depends(...) en los argumentos es el patrón de FastAPI
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert y contraseñas inventadas en los tests
"alembic/versions/**" = ["E501"]