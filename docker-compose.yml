# Caudal: servicios de Docker.
# Uso normal:  docker compose up -d --build   →   http://localhost:${APP_PORT}
# Comprobaciones de desarrollo (perfil "dev"):
#   docker compose run --rm tests                    → pytest
#   docker compose run --rm tests ruff check .       → lint de Python
#   docker compose run --rm tests ruff format .      → formatea el código Python
#   docker compose run --rm web                      → lint y build del frontend
#   docker compose --profile dev up -d vite          → frontend en vivo en http://localhost:5173
name: caudal

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: .env
    environment:
      DATABASE_HOST: db
      TZ: Europe/Madrid
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # --- Solo para desarrollo: no arrancan con "docker compose up" ---
  tests:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    env_file: .env
    environment:
      DATABASE_HOST: db
      TZ: Europe/Madrid
    volumes:
      - ./backend:/app
      - ./samples:/samples:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["dev"]
    image: node:24-slim
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run lint && npm run build"]

  # Servidor de desarrollo de Vite: al guardar un archivo del frontend, el navegador se actualiza.
  # Las llamadas a /api van a la app de Docker (servicio "app").
  vite:
    profiles: ["dev"]
    image: node:24-slim
    working_dir: /frontend
    environment:
      VITE_API_TARGET: http://app:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
